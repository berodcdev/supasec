# Production stack for supabase-pwn.
#
#   Internet ──▶ Caddy (:80/:443, auto-HTTPS)
#                 ├─ auth.<domain>  ─▶ Authelia (login portal + TOTP)
#                 └─ pwn.<domain>   ─▶ forward-auth ▶ Authelia, then ─▶ app
#
# The app and Authelia have NO host ports — they are reachable only through
# Caddy on the internal network. Nothing is exposed except 80/443.
#
# Bring it up with:  docker compose -f docker-compose.prod.yml up -d --build
# See deploy/README.md for the full first-run checklist (DNS, secrets, TOTP).

services:
  supabase-pwn:
    build: .
    container_name: supabase-pwn
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    expose:
      - "3000" # internal only — never published to the host
    networks:
      - web

  authelia:
    image: authelia/authelia:4.38
    container_name: authelia
    restart: unless-stopped
    volumes:
      - ./deploy/authelia:/config
    expose:
      - "9091"
    networks:
      - web
    env_file:
      - .env.prod
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
    healthcheck:
      test: ["CMD", "authelia", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    depends_on:
      - authelia
      - supabase-pwn
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

networks:
  web:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
