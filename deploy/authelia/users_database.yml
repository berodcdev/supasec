# Authelia users. One operator by default.
# Generate the password hash (do NOT store the plaintext) with:
#
#   docker run --rm authelia/authelia:4.38 \
#     authelia crypto hash generate argon2 --password 'YOUR-STRONG-PASSWORD'
#
# Paste the resulting $argon2id$... string as `password` below.
# On first login you'll set the email/password, then scan a TOTP QR code;
# the enrollment confirmation link is written to deploy/authelia/notification.txt.

users:
  operator:
    disabled: false
    displayname: 'Operator'
    password: '$argon2id$v=19$m=65536,t=3,p=4$REPLACE_WITH_GENERATED_HASH'
    email: 'operator@supasec.nodetp.com.br'
    groups:
      - 'admins'
